[project]
name = "reverb-backend"
version = "0.1.0"
description = "Reverb backend — 発信オペレーション基盤の API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
