services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reverb
      POSTGRES_PASSWORD: reverb
      POSTGRES_DB: reverb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://reverb:reverb@db:5432/reverb
      # 結合テスト用の別データベース。無ければ conftest が作る（design.md §13-1）。
      TEST_DATABASE_URL: postgresql+asyncpg://reverb:reverb@db:5432/reverb_test
      SECRET_KEY: change-me-in-local
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # ブラウザには出ない。BFF（Next.js のサーバー側）から FastAPI を呼ぶ先（ADR-0014）。
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules はイメージ側を使う。ホスト（macOS）で入れたものを持ち込まない。
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
