services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reverb
      POSTGRES_PASSWORD: reverb
      POSTGRES_DB: reverb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://reverb:reverb@db:5432/reverb
      SECRET_KEY: change-me-in-local
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # frontend は Next.js スケルトン作成後に追加する（frontend.md §7 の未決事項を確定してから）

volumes:
  db_data:
